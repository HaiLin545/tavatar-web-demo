# /etc/nginx/sites-available/tavatar-3dgs
# 或者 /etc/nginx/conf.d/tavatar-3dgs.conf

server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;  # 或者您的域名
    
    # 静态文件根目录 - 请替换为您的实际路径
    root /var/www/tavatar-3dgs/dist;
    index index.html;
    
    # 服务器名称和访问日志
    access_log /var/log/nginx/tavatar-3dgs.access.log;
    error_log /var/log/nginx/tavatar-3dgs.error.log;
    
    # 启用压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/wasm
        image/svg+xml;
    
    # 全局安全头部 - SharedArrayBuffer支持必需
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    
    # 其他安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 主路由 - SPA支持
    location / {
        try_files $uri $uri/ /index.html;
        
        # 确保HTML文件不被缓存
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }
    
    # viewer.html特殊处理 - 关键路由
    location = /viewer.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # 确保SharedArrayBuffer头部
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
    
    # JavaScript文件
    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/javascript";
    }
    
    # CSS文件
    location ~* \.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "text/css";
    }
    
    # WASM文件特殊处理 - WebAssembly支持
    location ~* \.wasm$ {
        add_header Content-Type "application/wasm" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 图片和媒体文件
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp4|webm|ogg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # 图片的CORS支持
        add_header Access-Control-Allow-Origin "*";
    }
    
    # 字体文件
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    
    # JSON和数据文件
    location ~* \.(json|xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header Content-Type "application/json";
    }
    
    # PLY文件支持 - 3DGS模型文件
    location ~* \.ply$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/octet-stream";
        
        # 大文件支持
        client_max_body_size 100M;
    }
    
    # OBJ文件支持 - 3D网格文件
    location ~* \.obj$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "text/plain";
    }
    
    # 资产文件夹特殊处理
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # 允许大文件上传/下载
        client_max_body_size 500M;
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问备份文件
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 404错误处理
    error_page 404 /index.html;
    
    # 50x错误处理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}